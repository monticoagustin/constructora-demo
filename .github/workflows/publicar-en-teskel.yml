name: Publicar en teskel.online/constructora

# En cada push a main, copia la app a la carpeta constructora/ del repo del Space
# "teskel" en Spacefast. Spacefast publica teskel solo. Solo toca constructora/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar-en-teskel-constructora
  cancel-in-progress: false

env:
  TESKEL_SPACE_ID: spc_02ae51f4db5a45b3a6c013388fe16504
  CARPETA_DESTINO: constructora

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo constructora-demo
        uses: actions/checkout@v4
        with:
          path: app-src

      - name: Validar la app antes de publicar
        working-directory: app-src
        run: |
          set -e
          for f in index.html manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png; do
            [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }
          done
          ls fonts/*.woff2 >/dev/null 2>&1 || { echo "::error::Falta la carpeta fonts/ con las tipografías"; exit 1; }
          # Regla del proyecto: sin service worker, para que ande bajo cualquier subpath.
          if grep -q "serviceWorker.register" index.html; then
            echo "::error::index.html registra un service worker; la app no debe usarlo."; exit 1
          fi
          # Regla del proyecto: app genérica, sin rastros de un cliente.
          if grep -qi "3df" index.html manifest.webmanifest; then
            echo "::error::La app menciona 3dF; tiene que ser genérica."; exit 1
          fi
          python3 -c "import json; json.load(open('manifest.webmanifest'))"
          echo "OK: app lista para publicar"

      - name: Pedir un remoto de push temporal para teskel
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_TOKEN }}
        run: |
          if [ -z "$SPACEFAST_TOKEN" ]; then
            echo "::error::Falta el secreto SPACEFAST_TOKEN en Settings → Secrets → Actions."; exit 1
          fi
          respuesta=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.spacefast.com/v1/spaces/${TESKEL_SPACE_ID}/source/push-remote" \
            -H "Authorization: Bearer ${SPACEFAST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ttlSeconds": 900}')
          codigo=$(echo "$respuesta" | tail -n1)
          cuerpo=$(echo "$respuesta" | sed '$d')
          if [ "$codigo" -ge 300 ]; then
            echo "::error::Spacefast respondió $codigo al pedir el remoto: $(echo "$cuerpo" | jq -r '.code // .title // .')"
            exit 1
          fi
          url=$(echo "$cuerpo" | jq -r '[.. | objects | .pushUrl? // empty][0]')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::La respuesta de Spacefast no trae pushUrl."; exit 1
          fi
          echo "::add-mask::$url"
          echo "TESKEL_REMOTE=$url" >> "$GITHUB_ENV"

      - name: Clonar teskel
        run: git clone --quiet --depth 1 --branch main "$TESKEL_REMOTE" teskel

      - name: Copiar la app a teskel/constructora
        run: |
          mkdir -p "teskel/${CARPETA_DESTINO}"
          # Solo los archivos que sirve la app; los docs del repo no se publican.
          rsync -a --delete \
            --include 'index.html' --include 'manifest.webmanifest' --include '*.png' \
            --include 'fonts/' --include 'fonts/*.woff2' \
            --exclude '*' \
            app-src/ "teskel/${CARPETA_DESTINO}/"

      - name: Commit y push a teskel
        working-directory: teskel
        env:
          MENSAJE_ORIGEN: ${{ github.event.head_commit.message }}
        run: |
          git add -A "${CARPETA_DESTINO}"
          if git diff --cached --quiet; then
            echo "Sin cambios en ${CARPETA_DESTINO}/; no hay nada que publicar."; exit 0
          fi
          git -c user.name="constructora-demo (GitHub Actions)" \
              -c user.email="actions@users.noreply.github.com" \
              commit -q -m "constructora: sincronizar desde monticoagustin/constructora-demo@${GITHUB_SHA::7}" \
                        -m "${MENSAJE_ORIGEN:-Ejecución manual}"
          git push --quiet origin HEAD:main
          echo "Publicado: https://teskel.online/${CARPETA_DESTINO}/"
